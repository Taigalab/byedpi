<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2f8f"/>
      <stop offset="1" stop-color="#2f7bf6"/>
    </linearGradient>
    <linearGradient id="pw-glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1bbf9c"/>
      <stop offset="1" stop-color="#7ef0d4"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="27" fill="url(#pw-bg)"/>

  <!-- Wall slab -->
  <rect x="30" y="30" width="68" height="72" rx="6" fill="#ffffff"/>
  <!-- brick seams -->
  <g stroke="#dfe6f2" stroke-width="2">
    <path d="M30 54 H98"/>
    <path d="M30 78 H98"/>
    <path d="M64 30 V54"/>
    <path d="M48 54 V78"/>
    <path d="M80 54 V78"/>
    <path d="M64 78 V102"/>
  </g>

  <!-- Archway doorway cut through the wall, glowing -->
  <path d="M52 102 V70 a12 12 0 0 1 24 0 V102 Z" fill="url(#pw-glow)"/>
  <!-- passage arrow -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M64 96 V74"/>
    <path d="M55 83 L64 73 L73 83"/>
  </g>
</svg>
