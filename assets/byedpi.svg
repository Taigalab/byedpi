<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7bf6"/>
      <stop offset="1" stop-color="#1bbf9c"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0a2540" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Rounded app tile -->
  <rect x="4" y="4" width="120" height="120" rx="27" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="27" fill="none" stroke="#0a2540" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Shield -->
  <g filter="url(#shadow)">
    <path d="M64 26 L94 37 V63 C94 82 81 95 64 102 C47 95 34 82 34 63 V37 Z"
          fill="url(#shield)"/>
  </g>

  <!-- Bypass arrow cutting through the shield -->
  <g stroke="#2f7bf6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M44 66 H80"/>
    <path d="M70 54 L84 66 L70 78"/>
  </g>

  <!-- Fragmentation marks: the packet split -->
  <g fill="#1bbf9c">
    <rect x="45" y="44" width="12" height="6" rx="3"/>
    <rect x="61" y="44" width="22" height="6" rx="3"/>
  </g>
</svg>
